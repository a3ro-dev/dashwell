<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --ground: #001935; /* Tumblr navy */
      --ink: #ffffff;
      --ink-2: #b9c6d4; /* secondary text, tinted from the navy */
      --line: #ffffff1f;
      --accent: #00b8ff;
      --danger: #ff6b55;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      width: 360px;
      margin: 0;
      padding: 16px 20px 24px;
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--ground);
      color: var(--ink);
    }
    h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
    .lede { margin: 0; color: var(--ink-2); }
    h2 { margin: 28px 0 8px; font-size: 17px; font-weight: 700; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 3px; }
    ul { list-style: none; margin: 0; padding: 0; }
    .post { padding: 10px 0; border-bottom: 1px solid var(--line); }
    .post a { display: block; color: var(--ink); font-weight: 600; }
    .post small { color: var(--ink-2); font-size: 13px; }
    .empty { margin: 0; color: var(--ink-2); }
    .update { display: flex; align-items: center; gap: 12px; margin-top: 16px; padding: 12px 14px; border-radius: 12px; background: #00b8ff1f; }
    .update[hidden] { display: none; }
    .update span { flex: 1; }
    .row {
      display: flex; align-items: center; gap: 16px;
      min-height: 56px; padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer;
    }
    .row span { flex: 1; }
    .row small { display: block; color: var(--ink-2); font-size: 13px; }
    .row input { appearance: none; flex: none; width: 44px; height: 26px; margin: 0; border-radius: 13px; background: #ffffff33; position: relative; cursor: pointer; transition: background-color 150ms ease-out; }
    .row input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform 150ms ease-out; }
    .row input:checked { background: var(--accent); }
    .row input:checked::after { transform: translateX(18px); }
    @media (prefers-reduced-motion: reduce) { .row input, .row input::after { transition: none; } }
    input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 16px; background: #ffffff14; color: var(--ink); font: inherit; font-size: 14px; border: 0; }
    button.chip { cursor: pointer; }
    button.chip:hover { background: #ffffff24; }
    form { display: flex; gap: 8px; margin-top: 12px; }
    form input { flex: 1; min-width: 0; min-height: 40px; padding: 0 12px; border: 1px solid #ffffff33; border-radius: 10px; background: #ffffff0d; color: var(--ink); font: inherit; }
    form input::placeholder { color: var(--ink-2); }
    .btn { min-height: 40px; padding: 0 16px; border: 0; border-radius: 20px; background: #ffffff1a; color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; }
    .btn:hover { background: #ffffff29; }
    .btn.primary { background: var(--accent); color: #001935; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .danger { margin-top: 32px; padding: 0; min-height: 40px; border: 0; background: none; color: var(--danger); font: inherit; cursor: pointer; }
    .hint { margin: 8px 0 0; color: var(--ink-2); font-size: 13px; }
    .version { margin: 8px 0 0; color: var(--ink-2); font-size: 13px; }
  </style>
</head>
<body>
  <h1>tumblr-new</h1>
  <p class="lede">Ads are blocked. Your feed stays varied.</p>
  <div class="update" id="update" hidden>
    <span id="update-text"></span>
    <a class="btn primary" id="update-link" href="#" target="_blank" rel="noopener">Get it</a>
  </div>

  <h2>New from your favorites</h2>
  <ul id="unread"><li><p class="empty">Nothing new yet.</p></li></ul>
  <div class="actions">
    <button class="btn" id="refresh" type="button">Check now</button>
    <button class="btn" id="read" type="button">Mark all as read</button>
  </div>

  <h2>Your feed</h2>
  <label class="row"><span>Keep my feed varied<small>Fold away posts on a topic you've seen a lot of lately</small></span><input type="checkbox" id="shapeFeed"></label>
  <label class="row"><span>Hide "Go Premium"<small>Remove Tumblr's upgrade buttons</small></span><input type="checkbox" id="hidePremium"></label>

  <h2>Favorite blogs</h2>
  <div class="chips" id="favs"></div>
  <form id="pin">
    <input id="blog" placeholder="Add a blog, like staff" aria-label="Blog to add to favorites" autocomplete="off" autocapitalize="off">
    <button class="btn primary">Add</button>
  </form>
  <p class="hint">Favorites are never folded away. Blogs you like a lot get added for you.</p>

  <h2>What it's learned you like</h2>
  <div class="chips" id="interests"></div>

  <button class="danger" id="reset" type="button">Start over</button>
  <p class="version" id="version"></p>

  <script src="feed.js"></script>
  <script src="popup.js"></script>
</body>
</html>
